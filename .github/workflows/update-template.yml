name: Check for updates
run-name: "Automated update @github-actions[bot]"

on:
  schedule:
    - cron: '59 23 * * 5'
  workflow_dispatch:
  workflow_call:
    inputs:
      repository:
        description: |-
          Location of the GitHub repository containing the package descriptions
          in the form of [HOST/]OWNER/REPO.
        type: string
        default: ${{ vars.PACKAGES_REPOSITORY }}

jobs:
  update-all:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout unstable branch
        uses: actions/checkout@v4
        with:
          ref: unstable
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for updates
        id: check-updates
        run: |
          chmod +x scripts/check_updates.sh
          ./scripts/check_updates.sh

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "No updates found"
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updates
        if: steps.check-updates.outputs.has_updates == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add srcpkgs
          git commit -m "Automated Sonic-DE package updates"

      - name: Push updates
        if: steps.check-updates.outputs.has_updates == 'true'
        uses: ad-m/github-push-action@v0.6.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: unstable
